<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ular Tangga Nusantara Ultimate - XII RPL 1</title>
    <!-- Pustaka PeerJS untuk Mabar Beda HP (Online) -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #f7f3f9;
            --card-bg: #ffffff;
            --accent-purple: #c3aed6;
            --text-dark: #4a4e69;
            --text-muted: #8d99ae;
            --board-cell-1: #fff0f5;
            --board-cell-2: #e6e6fa;
            --p1-color: #ff9aa2;
            --p2-color: #6eb5ff;
            --p3-color: #b5ead7;
            --p4-color: #ffdac1;
            --shadow-soft: 0 10px 25px rgba(168, 180, 200, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Poppins', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#e2d9f3 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        /* ---------------- HALAMAN LOGIN ---------------- */
        .login-screen {
            background: var(--card-bg);
            padding: 25px 20px;
            border-radius: 24px;
            box-shadow: var(--shadow-soft);
            width: 100%;
            max-width: 420px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 2px solid #ffffff;
        }

        .login-screen h1 {
            color: #6b5b95;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            text-align: left;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-left: 4px;
        }

        .input-group input, .input-group select {
            padding: 10px 14px;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            background: #fafafa;
            font-size: 0.9rem;
            outline: none;
            color: var(--text-dark);
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--accent-purple);
            background: #fff;
        }

        .online-box {
            background: #f3edff;
            padding: 12px;
            border-radius: 12px;
            border: 1px dashed var(--accent-purple);
            text-align: left;
            display: none;
        }

        .credits-card {
            background: linear-gradient(135deg, #fff0f5, #e6e6fa);
            border-radius: 14px;
            padding: 12px;
            border: 1px solid #f0e6ff;
            text-align: left;
        }

        .credits-card h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8a7090;
            margin-bottom: 6px;
        }

        .team-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .team-badge {
            background: #ffffff;
            color: #6b5b95;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid #eadbfe;
        }

        .class-badge {
            display: block;
            margin-top: 6px;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .btn-start {
            background: linear-gradient(135deg, #ffb7b2, #ff9aa2);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 154, 162, 0.4);
            width: 100%;
        }

        .btn-online {
            background: linear-gradient(135deg, #a8d8ea, #6eb5ff);
            color: #fff;
            margin-top: 5px;
        }

        /* ---------------- ARENA GAME ---------------- */
        .game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 900px;
        }

        header.game-header h2 {
            color: #6b5b95;
            font-size: 1.4rem;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .main-container {
                flex-direction: row;
                align-items: flex-start;
                justify-content: center;
            }
        }

        .board-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            aspect-ratio: 1 / 1;
            border: 6px solid #ffffff;
            border-radius: 18px;
            box-shadow: var(--shadow-soft);
            background-color: var(--board-cell-1);
            overflow: hidden;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            width: 100%;
            height: 100%;
        }

        .cell {
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 2px;
            font-size: 0.6rem;
            font-weight: 700;
            color: #7b7b93;
            position: relative;
        }

        .cell:nth-child(even) { background-color: var(--board-cell-2); }
        .cell:nth-child(odd) { background-color: var(--board-cell-1); }

        #gameCanvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .pawn-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .pawn {
            position: absolute;
            width: 6.5%;
            height: 6.5%;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: translate(-50%, -50%);
        }

        .pawn.p1 { background-color: var(--p1-color); }
        .pawn.p2 { background-color: var(--p2-color); }
        .pawn.p3 { background-color: var(--p3-color); }
        .pawn.p4 { background-color: var(--p4-color); }

        .controls-panel {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 15px;
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: var(--shadow-soft);
        }

        .players-status-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 140px;
            overflow-y: auto;
        }

        .player-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid transparent;
        }

        .player-card.active {
            border-color: var(--accent-purple);
            background: #f3edff;
        }

        .player-card .name { font-size: 0.8rem; font-weight: 700; }
        .player-card .pos { font-size: 0.95rem; font-weight: 800; }

        .dice-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .dice {
            width: 55px;
            height: 55px;
            background: #ffffff;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #6b5b95;
            box-shadow: 0 4px 12px rgba(180, 160, 200, 0.2);
            border: 2px solid #f0e6ff;
        }

        .btn-roll {
            width: 100%;
            padding: 10px;
            font-size: 0.9rem;
            background: linear-gradient(135deg, #b5ead7, #95dac1);
            color: #2d5a4c;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .log-box {
            background: #faf7fc;
            border-radius: 10px;
            padding: 8px;
            height: 60px;
            overflow-y: auto;
            font-size: 0.7rem;
            color: var(--text-dark);
            display: flex;
            flex-direction: column-reverse;
            border: 1px solid #f0e6ff;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(74, 78, 105, 0.5);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #ffffff;
            border-radius: 20px;
            padding: 22px;
            text-align: center;
            max-width: 300px;
            box-shadow: var(--shadow-soft);
        }

        .modal-content h2 { color: #6b5b95; margin-bottom: 6px; }
        .modal-content button {
            margin-top: 12px;
            padding: 8px 20px;
            background: #ff9aa2;
            color: #fff;
            border: none;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- HALAMAN LOGIN -->
    <div id="loginScreen" class="login-screen">
        <div>
            <h1>Ular Tangga Nusantara</h1>
            <p style="font-size: 0.75rem; color: #8d99ae;">AI Bot, 4 Pemain Lokal & Mabar Online</p>
        </div>

        <div class="input-group">
            <label for="gameModeSelect">Mode Permainan:</label>
            <select id="gameModeSelect" onchange="switchGameMode()">
                <option value="local">Mabar Lokal (1 - 4 Pemain)</option>
                <option value="bot">Lawan AI Bot Pintar</option>
                <option value="online">Mabar Beda HP (Online Room)</option>
            </select>
        </div>

        <!-- Pilihan Lokal / Bot -->
        <div id="localSetup">
            <div class="input-group">
                <label>Jumlah Pemain:</label>
                <select id="numPlayersSelect" onchange="updatePlayerInputs()">
                    <option value="1">1 Pemain (Latihan)</option>
                    <option value="2">2 Pemain</option>
                    <option value="3">3 Pemain</option>
                    <option value="4" selected>4 Pemain</option>
                </select>
            </div>
            <div id="playerInputsContainer" style="margin-top: 8px; display: flex; flex-direction: column; gap: 6px;"></div>
        </div>

        <!-- Pilihan Online Beda HP -->
        <div id="onlineSetup" class="online-box">
            <div class="input-group" style="margin-bottom: 8px;">
                <label>Nama Kamu (Online):</label>
                <input type="text" id="myOnlineName" value="Pemain 1" placeholder="Masukkan namamu...">
            </div>
            <button class="btn-start btn-online" onclick="hostRoom()">Buat Ruangan Baru (Host)</button>
            <div style="margin-top: 8px; display: flex; gap: 5px;">
                <input type="text" id="roomCodeInput" placeholder="Kode Teman..." style="flex:1; padding:6px;">
                <button class="btn-start" style="padding: 6px 12px;" onclick="joinRoom()">Gabung</button>
            </div>
            <p id="onlineStatus" style="font-size: 0.7rem; color: #6b5b95; margin-top: 6px; font-weight: bold;"></p>
        </div>

        <div class="credits-card">
            <h3>Dibuat Oleh Kelompok:</h3>
            <div class="team-list">
                <span class="team-badge">🌸 Fifi</span>
                <span class="team-badge">🌷 Sitah</span>
                <span class="team-badge">🌺 Sipa</span>
            </div>
            <span class="class-badge">Kelas: XII RPL 1</span>
        </div>

        <button class="btn-start" id="btnStartGame" onclick="startGame()">Mulai Game ✨</button>
    </div>

    <!-- HALAMAN GAME -->
    <div id="gameScreen" class="game-screen">
        <header class="game-header">
            <h2>Ular Tangga Nusantara 🎲</h2>
        </header>

        <div class="main-container">
            <div class="board-wrapper">
                <div id="board"></div>
                <canvas id="gameCanvas"></canvas>
                <div class="pawn-container" id="pawnContainer">
                    <div id="pawn1" class="pawn p1"></div>
                    <div id="pawn2" class="pawn p2"></div>
                    <div id="pawn3" class="pawn p3" style="display:none;"></div>
                    <div id="pawn4" class="pawn p4" style="display:none;"></div>
                </div>
            </div>

            <div class="controls-panel">
                <div class="players-status-list" id="playersStatusList"></div>

                <div class="dice-section">
                    <div id="dice" class="dice">⚀</div>
                    <button id="btnRoll" class="btn-roll" onclick="handleRoll()">Kocok Dadu 🎲</button>
                </div>

                <div id="logBox" class="log-box">
                    <div class="log-entry">Game siap! Silakan kocok dadu.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL PEMENANG -->
    <div id="winnerModal" class="modal">
        <div class="modal-content">
            <h2 id="winnerText">Pemenang! 🎉</h2>
            <p>Selamat atas pencapaian tertingginya!</p>
            <button onclick="resetGame()">Main Lagi</button>
        </div>
    </div>

    <script>
        const snakes = { 
            98: { to: 78, color: '#ffb7b2' }, 
            95: { to: 56, color: '#ffdac1' }, 
            88: { to: 24, color: '#ff9aa2' }, 
            62: { to: 18, color: '#f8a5c2' }, 
            48: { to: 26, color: '#fde2e4' }, 
            36: { to: 6,  color: '#ffb7b2' }, 
            32: { to: 10, color: '#ff9aa2' } 
        };

        const ladders = { 
            4: { to: 14, color: '#b5ead7' }, 
            9: { to: 31, color: '#c3aed6' }, 
            20: { to: 38, color: '#a8d8ea' }, 
            28: { to: 84, color: '#b5ead7' }, 
            40: { to: 59, color: '#c3aed6' }, 
            51: { to: 67, color: '#a8d8ea' }, 
            63: { to: 81, color: '#b5ead7' }, 
            71: { to: 91, color: '#c3aed6' } 
        };

        const diceIcons = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

        let players = [];
        let currentPlayerIndex = 0;
        let isRolling = false;
        let playMode = 'local'; 

        let peer, conn;
        let isHost = false;
        let myOnlineName = "Pemain 1";

        const boardEl = document.getElementById('board');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function switchGameMode() {
            playMode = document.getElementById('gameModeSelect').value;
            document.getElementById('localSetup').style.display = (playMode === 'online') ? 'none' : 'block';
            document.getElementById('onlineSetup').style.display = (playMode === 'online') ? 'block' : 'none';
            document.getElementById('btnStartGame').style.display = (playMode === 'online') ? 'none' : 'block';

            if (playMode === 'bot') {
                document.getElementById('numPlayersSelect').value = "1";
                updatePlayerInputs();
            } else if (playMode === 'local') {
                updatePlayerInputs();
            }
        }

        function updatePlayerInputs() {
            const count = playMode === 'bot' ? 1 : parseInt(document.getElementById('numPlayersSelect').value);
            const container = document.getElementById('playerInputsContainer');
            container.innerHTML = '';

            for (let i = 1; i <= count; i++) {
                container.innerHTML += `
                    <div class="input-group">
                        <label>Nama Pemain ${i}:</label>
                        <input type="text" id="pName${i}" value="Pemain ${i}" placeholder="Nama...">
                    </div>
                `;
            }
        }

        window.onload = () => { updatePlayerInputs(); };

        // --- PEERJS ONLINE ---
        function hostRoom() {
            myOnlineName = document.getElementById('myOnlineName').value.trim() || "Host";
            let code = "RPL-" + Math.floor(100 + Math.random() * 900);
            peer = new Peer(code);
            isHost = true;

            peer.on('open', (id) => {
                document.getElementById('onlineStatus').innerText = `Kode Ruangan: ${id} (Bagikan ke teman!)`;
            });

            peer.on('connection', (connection) => {
                conn = connection;
                document.getElementById('onlineStatus').innerText = "Teman terhubung! Menunggu nama...";
                
                conn.on('data', (data) => {
                    if (data.type === 'join_info') {
                        let guestName = data.name;
                        players = [
                            { name: myOnlineName, pos: 1, id: 1 },
                            { name: guestName, pos: 1, id: 2 }
                        ];
                        conn.send({ type: 'start_game', players: players });
                        launchGameScreen(2);
                    }
                });
            });
        }

        function joinRoom() {
            let code = document.getElementById('roomCodeInput').value.trim();
            myOnlineName = document.getElementById('myOnlineName').value.trim() || "Guest";
            if (!code) { alert("Masukkan kode ruangan!"); return; }

            peer = new Peer();
            isHost = false;

            peer.on('open', () => {
                document.getElementById('onlineStatus').innerText = "Menghubungkan ke ruangan...";
                conn = peer.connect(code);

                conn.on('open', () => {
                    document.getElementById('onlineStatus').innerText = "Terhubung! Mengirim nama...";
                    conn.send({ type: 'join_info', name: myOnlineName });
                });

                conn.on('data', (data) => {
                    if (data.type === 'start_game') {
                        players = data.players;
                        launchGameScreen(2);
                    } else {
                        handlePeerData(data);
                    }
                });
            });
        }

        function startGame() {
            const count = playMode === 'bot' ? 1 : parseInt(document.getElementById('numPlayersSelect').value);
            players = [];

            for (let i = 1; i <= count; i++) {
                let name = document.getElementById(`pName${i}`).value.trim() || `Pemain ${i}`;
                players.push({ name: name, pos: 1, id: i });
            }

            if (playMode === 'bot') {
                players.push({ name: "AI Bot 🤖", pos: 1, id: 2 });
            }

            launchGameScreen(players.length);
        }

        function launchGameScreen(playerCount) {
            currentPlayerIndex = 0;
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';

            for (let i = 1; i <= 4; i++) {
                document.getElementById(`pawn${i}`).style.display = (i <= playerCount) ? 'block' : 'none';
            }

            renderStatusList();
            createBoard();
            setTimeout(() => { drawOverlay(); updatePawns(); }, 100);
        }

        function renderStatusList() {
            const listEl = document.getElementById('playersStatusList');
            listEl.innerHTML = '';
            players.forEach((p, idx) => {
                listEl.innerHTML += `
                    <div id="playerCard${idx}" class="player-card ${idx === 0 ? 'active' : ''}">
                        <span class="name" style="color: var(--p${p.id}-color);">${p.name}</span>
                        <span class="pos" id="posP${idx}">Kotak: ${p.pos}</span>
                    </div>
                `;
            });
        }

        function createBoard() {
            boardEl.innerHTML = '';
            for (let row = 9; row >= 0; row--) {
                for (let col = 0; col < 10; col++) {
                    let cellNum = (row % 2 === 1) ? row * 10 + (10 - col) : row * 10 + (col + 1);
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${cellNum}`;
                    cell.innerText = cellNum;
                    boardEl.appendChild(cell);
                }
            }
        }

        function getCellCenter(cellNum) {
            const cell = document.getElementById(`cell-${cellNum}`);
            const boardRect = boardEl.getBoundingClientRect();
            const cellRect = cell.getBoundingClientRect();
            return {
                x: cellRect.left - boardRect.left + cellRect.width / 2,
                y: cellRect.top - boardRect.top + cellRect.height / 2
            };
        }

        function drawOverlay() {
            canvas.width = boardEl.clientWidth;
            canvas.height = boardEl.clientHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let start in ladders) {
                let item = ladders[start];
                let p1 = getCellCenter(start);
                let p2 = getCellCenter(item.to);

                ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = item.color; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.stroke();
                ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
            }

            for (let start in snakes) {
                let item = snakes[start];
                let p1 = getCellCenter(start);
                let p2 = getCellCenter(item.to);

                ctx.beginPath(); ctx.moveTo(p1.x, p1.y);
                let midX = (p1.x + p2.x) / 2 + 16;
                let midY = (p1.y + p2.y) / 2 - 16;
                ctx.quadraticCurveTo(midX, midY, p2.x, p2.y);
                ctx.strokeStyle = item.color; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
            }
        }

        function updatePawns() {
            players.forEach((p, idx) => {
                let coords = getCellCenter(p.pos);
                let pawnEl = document.getElementById(`pawn${p.id}`);
                let offsetX = (idx === 1) ? 5 : (idx === 2) ? -5 : (idx === 3) ? 8 : 0;
                let offsetY = (idx === 2) ? 5 : (idx === 3) ? -5 : 0;

                pawnEl.style.left = `${coords.x + offsetX}px`;
                pawnEl.style.top = `${coords.y + offsetY}px`;

                let posLabel = document.getElementById(`posP${idx}`);
                if (posLabel) posLabel.innerText = `Kotak: ${p.pos}`;
            });
        }

        function addLog(msg) {
            const logBox = document.getElementById('logBox');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerText = msg;
            logBox.prepend(entry);
        }

        function handleRoll() {
            if (isRolling) return;
            
            // HAPUS VALIDASI PEMBLOKIRAN GILIRAN ONLINE SUPAYA TIDAK ADA LAGI POPUP "Bukan giliranmu!"
            isRolling = true;
            document.getElementById('btnRoll').disabled = true;

            const diceEl = document.getElementById('dice');
            let rollCount = 0;

            let interval = setInterval(() => {
                let tempRoll = Math.floor(Math.random() * 6) + 1;
                diceEl.innerText = diceIcons[tempRoll - 1];
                rollCount++;

                if (rollCount > 10) {
                    clearInterval(interval);
                    let finalRoll = Math.floor(Math.random() * 6) + 1;
                    diceEl.innerText = diceIcons[finalRoll - 1];

                    // Kirim hasil lemparan dadu dan giliran ke HP lawan secara instan
                    if (playMode === 'online' && conn && conn.open) {
                        conn.send({ type: 'roll', steps: finalRoll, playerIdx: currentPlayerIndex });
                    }

                    processMove(finalRoll);
                }
            }, 50);
        }

        function processMove(steps) {
            let activePlayer = players[currentPlayerIndex];
            addLog(`${activePlayer.name} melempar dadu: ${steps}`);

            let currentPos = activePlayer.pos;
            let targetPos = currentPos + steps;

            if (targetPos > 100) {
                addLog(`${activePlayer.name} butuh angka pas.`);
                finishTurn();
                return;
            }

            let stepInterval = setInterval(() => {
                currentPos++;
                activePlayer.pos = currentPos;
                updatePawns();

                if (currentPos === targetPos) {
                    clearInterval(stepInterval);

                    setTimeout(() => {
                        if (ladders[targetPos]) {
                            addLog(`✨ ${activePlayer.name} naik tangga ke-${ladders[targetPos].to}`);
                            activePlayer.pos = ladders[targetPos].to;
                            updatePawns();
                        } else if (snakes[targetPos]) {
                            addLog(`🐍 ${activePlayer.name} kena ular ke-${snakes[targetPos].to}`);
                            activePlayer.pos = snakes[targetPos].to;
                            updatePawns();
                        }

                        if (activePlayer.pos === 100) {
                            document.getElementById('winnerText').innerText = `${activePlayer.name} Menang! 🎉`;
                            document.getElementById('winnerModal').style.display = 'flex';
                            return;
                        }

                        finishTurn();
                    }, 250);
                }
            }, 180);
        }

        function finishTurn() {
            document.getElementById(`playerCard${currentPlayerIndex}`).classList.remove('active');
            currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            document.getElementById(`playerCard${currentPlayerIndex}`).classList.add('active');

            isRolling = false;
            document.getElementById('btnRoll').disabled = false;
            addLog(`Giliran: ${players[currentPlayerIndex].name}`);

            if (playMode === 'bot' && players[currentPlayerIndex].name.includes("AI Bot")) {
                document.getElementById('btnRoll').disabled = true;
                setTimeout(() => { handleRoll(); }, 1000);
            }
        }

        function handlePeerData(data) {
            if (data.type === 'roll') {
                currentPlayerIndex = data.playerIdx;
                document.querySelectorAll('.player-card').forEach((c, i) => c.classList.toggle('active', i === currentPlayerIndex));
                document.getElementById('dice').innerText = diceIcons[data.steps - 1];
                processMove(data.steps);
            }
        }

        function resetGame() {
            players.forEach(p => p.pos = 1);
            currentPlayerIndex = 0;
            isRolling = false;
            document.getElementById('winnerModal').style.display = 'none';
            renderStatusList();
            document.getElementById('btnRoll').disabled = false;
            document.getElementById('logBox').innerHTML = '<div class="log-entry">Game direset!</div>';
            updatePawns();
        }
    </script>
</body>
</html>
